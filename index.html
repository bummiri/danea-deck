:root{
  color-scheme:light;
  /* 🔒 11/09 글씨는 전부 흰색이 되었다 */
  --ink:#FFFFFF;
  --ink-2:rgba(255,255,255,.90);
  --ink-3:rgba(255,255,255,.68);
  --ease:cubic-bezier(.32,.72,0,1);
  --ease-out:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#C64A0A;color:var(--ink);
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;display:grid;place-items:center;
  /* 🔴 두 값 축약(세로 가로)이면 위아래에 left 값이 들어간다. 네 값으로 또박또박 */
  padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px))
          max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  overflow:hidden}

/* ═══ 바탕 = 주황 그라디언트 ════════════════════════════════════
   🔒 11/09 대표 「배경만 오렌지색 그라디언트로 비춰서 보이는거야」
   사진(iOS 26 제어센터)은 색이 전부 유리 **뒤**에 있다. 그래서 주황을
   카드 밖으로 꺼냈다. 유리는 그 위에 얹혀 뒤를 비추고 꺾는다 */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    /* ③ 고운 결. 평소엔 거의 안 보이다가 유리 가장자리에서 꺾일 때 드러난다 */
    repeating-linear-gradient(37deg,
      rgba(92,26,0,.075) 0px, rgba(92,26,0,.075) 9px,
      rgba(255,255,255,0) 21px, rgba(255,255,255,0) 33px,
      rgba(255,216,154,.06) 44px, rgba(255,216,154,0) 60px),
    /* ② 가운데를 깊게 눌러 흰 글씨가 읽히는 자리를 만든다 */
    radial-gradient(78% 62% at 50% 50%,
      rgba(80,22,0,.70), rgba(80,22,0,.30) 56%, rgba(80,22,0,0) 86%),
    /* ① 바탕 */
    radial-gradient(132% 102% at 50% -8%,
      #FFBE4D 0%, #FF9226 26%, #F56C0B 50%, #C64A0A 78%, #8A3005 100%)}

/* 움직이는 빛 웅덩이. 전에는 카드 안에 있었는데 바탕으로 옮겼다.
   🔵 덩어리는 그릇보다 작아야 움직이는 게 보인다. 여기서 그릇은 화면이다 */
.bg::before,.bg::after{content:"";position:absolute;display:block;
  will-change:transform,opacity}
.bg::before{width:80%;height:68%;left:-9%;top:-15%;filter:blur(64px);
  background:radial-gradient(closest-side,
    rgba(255,208,126,.66), rgba(255,208,126,.20) 52%, rgba(255,208,126,0) 76%);
  animation:liqA 11s ease-in-out infinite}
.bg::after{width:72%;height:60%;right:-11%;bottom:-11%;filter:blur(70px);
  background:radial-gradient(closest-side,
    rgba(100,26,0,.56), rgba(100,26,0,.17) 54%, rgba(100,26,0,0) 76%);
  animation:liqB 15s ease-in-out infinite}
/* 바탕 위를 쓸고 가는 빛 한 줄 */
.bg i{position:absolute;display:block;left:-18%;top:-26%;width:88%;height:152%;
  background:linear-gradient(104deg,
    rgba(255,255,255,0) 34%, rgba(255,242,218,.34) 45%,
    rgba(255,255,255,.46) 50%, rgba(255,238,210,.22) 55%,
    rgba(255,255,255,0) 66%);
  filter:blur(20px);mix-blend-mode:soft-light;
  will-change:transform,opacity;
  animation:liqC 8.5s ease-in-out infinite}

/* 🔵 주기가 11·15·8.5·7 이라 최소공배수가 멀다. 같은 그림이 다시 오지 않는다 */
@keyframes liqA{
  0%  {transform:translate3d(0,0,0) scale(1);opacity:.78}
  26% {transform:translate3d(16%,11%,0) scale(1.16);opacity:1}
  52% {transform:translate3d(-9%,19%,0) scale(.9);opacity:.62}
  78% {transform:translate3d(-17%,-7%,0) scale(1.1);opacity:.92}
  100%{transform:translate3d(0,0,0) scale(1);opacity:.78}}
@keyframes liqB{
  0%  {transform:translate3d(0,0,0) scale(1);opacity:.7}
  30% {transform:translate3d(-18%,-12%,0) scale(1.2);opacity:.98}
  58% {transform:translate3d(13%,-19%,0) scale(.88);opacity:.52}
  82% {transform:translate3d(19%,9%,0) scale(1.12);opacity:.84}
  100%{transform:translate3d(0,0,0) scale(1);opacity:.7}}
@keyframes liqC{
  0%  {transform:translate3d(-34%,20%,0) rotate(-9deg);opacity:0}
  18% {opacity:.62}
  50% {transform:translate3d(26%,-17%,0) rotate(8deg);opacity:.92}
  82% {opacity:.5}
  100%{transform:translate3d(-34%,20%,0) rotate(-9deg);opacity:0}}
@keyframes liqS{
  0%,100%{opacity:.64}
  50%    {opacity:1}}
/* 🔴 11/09 찾음 : 이 키프레임이 아예 없어서 등장 움직임이 한 번도 안 돌았다 */
@keyframes up{
  from{opacity:0;transform:translateY(14px) scale(.985)}
  to  {opacity:1;transform:none}}

/* ═══ 카드 = 맑은 유리 ═════════════════════════════════════════
   🔵🔵 뷰포트에 직접 못 박는다. 본문 높이나 스크롤과 상관이 없다 */
.card{position:fixed;inset:0;margin:auto;height:fit-content;
  z-index:1;width:min(366px,calc(100% - 40px));
  padding:clamp(30px,4.6vw,42px) clamp(22px,3.8vw,32px) clamp(24px,3.6vw,31px);
  border-radius:30px;text-align:center;border:0;isolation:isolate;color:#fff;
  /* 사진 속 알약처럼 거의 맑다. 빛을 받는 쪽만 밝다 */
  background:linear-gradient(142deg,
    rgba(255,255,255,.30) 0%,
    rgba(255,255,255,.15) 26%,
    rgba(255,255,255,.08) 52%,
    rgba(255,255,255,.11) 76%,
    rgba(255,255,255,.21) 100%);
  -webkit-backdrop-filter:blur(13px) saturate(142%);
  backdrop-filter:blur(13px) saturate(142%);
  box-shadow:
    inset 0 1.7px 0 rgba(255,255,255,.94),
    inset 1.7px 0 0 rgba(255,255,255,.62),
    inset 0 -1.7px 0 rgba(255,255,255,.38),
    inset -1.7px 0 0 rgba(255,255,255,.32),
    inset 0 22px 36px -26px rgba(255,255,255,.68),
    inset 0 -26px 46px -30px rgba(86,26,0,.46),
    0 34px 80px -30px rgba(62,18,0,.55),
    0 6px 18px -10px rgba(62,18,0,.28);
  animation:up .72s var(--ease-out) backwards}
.card > *{position:relative;z-index:3}

/* 🔵 흰 글씨가 읽히게 하는 어두운 웅덩이.
   테두리에서 15px 물러나 있어 가장자리는 맑은 유리로 남는다.
   사진 속 알약도 가운데만 색이 있고 테두리는 맑다 */
.card > .tint{position:absolute;inset:15px;z-index:0;border-radius:18px;
  pointer-events:none;
  background:radial-gradient(90% 100% at 50% 42%,
    rgba(48,10,0,.95), rgba(48,10,0,.70) 56%, rgba(48,10,0,.17) 86%, rgba(48,10,0,0) 100%);
  filter:blur(11px)}

/* 표면을 비스듬히 스치는 긴 하이라이트 한 줄 */
.card::before{content:"";position:absolute;inset:0;z-index:1;
  border-radius:inherit;pointer-events:none;overflow:hidden;
  background:linear-gradient(118deg,
    rgba(255,255,255,0) 31%,
    rgba(255,255,255,.10) 39%,
    rgba(255,255,255,.17) 42.5%,
    rgba(255,255,255,.05) 46%,
    rgba(255,255,255,0) 53%);
  opacity:.75;mix-blend-mode:soft-light;
  animation:liqS 7s ease-in-out infinite}

/* 유리 두께가 만드는 테두리 실선 */
.card::after{content:"";position:absolute;inset:0;z-index:2;
  border-radius:inherit;pointer-events:none;padding:1.5px;
  background:linear-gradient(142deg,
    rgba(255,255,255,1) 0%,
    rgba(255,255,255,.64) 16%,
    rgba(255,255,255,.20) 40%,
    rgba(255,255,255,.32) 62%,
    rgba(255,238,212,.74) 86%,
    rgba(255,255,255,.96) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude}

/* 포인터를 따라 움직이는 표면 반사 */
.card .lick{position:absolute;inset:0;z-index:2;border-radius:inherit;
  overflow:hidden;pointer-events:none;opacity:0;
  transition:opacity .4s var(--ease)}
.card:hover .lick,.card:focus-within .lick{opacity:1}
.lick::before{content:"";position:absolute;width:150%;height:150%;
  left:var(--lx,50%);top:var(--ly,50%);transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,
    rgba(255,255,255,.52), rgba(255,255,255,.14) 44%, rgba(255,255,255,0) 72%);
  mix-blend-mode:soft-light}

.logo{display:block;width:clamp(94px,27%,114px);height:auto;margin:0 auto}

/* 화면 최하단 가운데 로고. 뷰포트에 못 박고 아래 안전영역을 피한다 */
.mark{position:fixed;left:0;right:0;bottom:max(24px,env(safe-area-inset-bottom,0px));
  z-index:1;width:68px;height:auto;margin:0 auto;display:block;
  opacity:.84;pointer-events:none;
  animation:up .72s var(--ease-out) .12s backwards}

.say{margin:clamp(17px,3vw,23px) 0 0;font-size:13.2px;line-height:1.72;
  letter-spacing:-.028em;color:var(--ink-2);text-wrap:pretty;
  text-shadow:0 1px 3px rgba(58,14,0,.42)}

form{margin-top:clamp(17px,2.8vw,22px);display:flex;flex-direction:column;gap:9px}

/* 🔵🔵 여기부터는 흐림을 겹치지 않는다. 유리 위에 유리를 또 흐리면 뒤가 죽는다 */
input,button{height:47px;border:0;border-radius:999px;
  font-family:inherit;font-size:14px;color:#fff;
  transition:transform .18s var(--ease),box-shadow .22s var(--ease),background-color .22s var(--ease)}

/* 입력칸 : 옅은 주황 유리. 뒤가 비친다 */
input{width:100%;padding:0 18px;letter-spacing:.02em;text-align:center;outline:0;
  background:linear-gradient(142deg,rgba(92,28,2,.40),rgba(66,18,0,.53) 58%,rgba(54,14,0,.57));
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.72),
    inset 1.4px 0 0 rgba(255,255,255,.30),
    inset 0 -1.4px 0 rgba(255,220,180,.16),
    inset 0 10px 18px -12px rgba(40,10,0,.30)}
input::placeholder{color:rgba(255,255,255,.72);letter-spacing:-.02em}
input:focus{background:linear-gradient(142deg,rgba(82,24,0,.48),rgba(58,16,0,.60) 58%,rgba(46,12,0,.64));
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.88),
    inset 0 -1.4px 0 rgba(255,220,180,.2),
    0 0 0 3.5px rgba(255,255,255,.28)}

/* 「열람하기」 : 사진 속 어두운 원처럼 짙은 유리. 뒤 주황이 비친다 */
button{position:relative;cursor:pointer;letter-spacing:-.02em;
  background:linear-gradient(142deg,rgba(86,26,0,.46),rgba(58,14,0,.60) 56%,rgba(40,10,0,.66));
  text-shadow:0 1px 2.5px rgba(30,6,0,.5);
  box-shadow:
    inset 0 1.7px 0 rgba(255,255,255,.62),
    inset 1.7px 0 0 rgba(255,255,255,.26),
    inset 0 -1.7px 0 rgba(255,214,170,.18),
    inset -1.7px 0 0 rgba(255,214,170,.14),
    inset 0 18px 28px -20px rgba(255,255,255,.34),
    inset 0 -18px 30px -20px rgba(28,6,0,.44),
    0 16px 34px -16px rgba(34,8,0,.52)}
/* 🔵 글자 밑에만 까는 어두운 웅덩이. 양 끝은 비치는 채로 둔다.
   z-index:-1 이라 버튼 바탕 위, 글자 아래에 깔린다 */
button::before{content:"";position:absolute;inset:0;z-index:-1;
  border-radius:inherit;pointer-events:none;
  background:radial-gradient(54% 150% at 50% 50%,
    rgba(26,6,0,.46), rgba(26,6,0,.22) 54%, rgba(26,6,0,0) 86%)}
/* 버튼 표면을 스치는 빛 한 줄 */
button::after{content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,0) 28%,
    rgba(255,255,255,.14) 38%,rgba(255,255,255,.28) 43%,
    rgba(255,255,255,.09) 48%,rgba(255,255,255,0) 58%)}
button:hover:not(:disabled){transform:translateY(-1.5px);
  background:linear-gradient(142deg,rgba(100,32,2,.50),rgba(70,18,0,.63) 56%,rgba(50,12,0,.69));
  box-shadow:
    inset 0 1.7px 0 rgba(255,255,255,.76),
    inset 1.7px 0 0 rgba(255,255,255,.3),
    inset 0 -1.7px 0 rgba(255,214,170,.22),
    inset 0 18px 28px -20px rgba(255,255,255,.44),
    inset 0 -18px 30px -20px rgba(28,6,0,.42),
    0 20px 38px -14px rgba(34,8,0,.56)}
button:active:not(:disabled){transform:translateY(0) scale(.992)}
button:disabled{opacity:.6;cursor:default}

.msg{min-height:16px;margin:3px 0 0;font-size:11.8px;line-height:1.45;
  letter-spacing:-.02em;color:#FFE2C2;opacity:0;
  text-shadow:0 1px 2px rgba(50,12,0,.5);
  transition:opacity .2s var(--ease)}
.msg.on{opacity:1}
.msg.wait{color:var(--ink-3)}

/* ═══ 유리가 빛을 꺾는다 ══════════════════════════════════════
   🔒 11/09 대표 「아니.. 유리재질이라니까?」 + iOS 26 사진
   색이 아니라 **굴절**이 빠져 있었다. backdrop-filter 에 SVG 변위 필터를 건다.
   🔴 .lens 는 굴절이 되는 브라우저에서만 켜진다. 안 되면 위 모습 그대로다
   🔴 흐림이 세면 뒤를 미리 뭉개 버려서 휠 것이 안 남는다. 켜질 때 흐림을 낮춘다 */
.lens .card{
  -webkit-backdrop-filter:blur(4px) saturate(150%) url(#lgCard);
  backdrop-filter:blur(4px) saturate(150%) url(#lgCard)}
.lens input{
  -webkit-backdrop-filter:blur(1.5px) saturate(130%) url(#lgField);
  backdrop-filter:blur(1.5px) saturate(130%) url(#lgField)}
.lens button{
  -webkit-backdrop-filter:blur(2px) saturate(140%) url(#lgBtn);
  backdrop-filter:blur(2px) saturate(140%) url(#lgBtn)}

@media (prefers-reduced-motion:reduce){
  .card,.mark,.card::before,.bg::before,.bg::after,.bg i{animation:none}
  .bg i{opacity:.4;transform:none}
  .card .lick{display:none}
  *{transition:none!important}
}

</style>
</head>
<body>
<!-- 🔵 굴절 필터 셋. href 와 scale 은 화면에서 요소를 재어 채운다 -->
<svg width="0" height="0" aria-hidden="true" focusable="false"
     style="position:fixed;left:-1px;top:-1px;opacity:0;pointer-events:none">
 <filter id="lgCard" x="0" y="0" width="100%" height="100%"
         primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
  <feImage id="mCard" x="0" y="0" width="100%" height="100%"
           preserveAspectRatio="none" result="m"/>
  <feDisplacementMap id="dCard" in="SourceGraphic" in2="m" scale="0"
           xChannelSelector="R" yChannelSelector="G"/>
 </filter>
 <filter id="lgField" x="0" y="0" width="100%" height="100%"
         primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
  <feImage id="mField" x="0" y="0" width="100%" height="100%"
           preserveAspectRatio="none" result="m"/>
  <feDisplacementMap id="dField" in="SourceGraphic" in2="m" scale="0"
           xChannelSelector="R" yChannelSelector="G"/>
 </filter>
 <filter id="lgBtn" x="0" y="0" width="100%" height="100%"
         primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
  <feImage id="mBtn" x="0" y="0" width="100%" height="100%"
           preserveAspectRatio="none" result="m"/>
  <feDisplacementMap id="dBtn" in="SourceGraphic" in2="m" scale="0"
           xChannelSelector="R" yChannelSelector="G"/>
 </filter>
</svg>
<div class="bg" aria-hidden="true"><i></i></div>

<img class="mark" src="logo.png" alt="DANEA">

<main class="card">
  <span class="tint" aria-hidden="true"></span>
  <span class="lick" aria-hidden="true"></span>
  <img class="logo" src="logo.png" alt="DANEA">
  <p class="say">소개서 열람을 위해<br>전달받은 비밀번호를 입력해주세요</p>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="비밀번호">
    <button id="go" type="submit">열람하기</button>
    <p class="msg" id="m" role="status" aria-live="polite"></p>
  </form>
</main>

<script>
(function(){
  var f=document.getElementById('f'), pw=document.getElementById('pw'),
      go=document.getElementById('go'), m=document.getElementById('m');
  var pack=null;

  function say(t, wait){
    m.textContent=t;
    m.className='msg on'+(wait?' wait':'');
    if(!t) m.className='msg';
  }

  /* 잠긴 본문은 미리 받아 둔다. 비밀번호가 맞는 순간 바로 열리게 */
  var pre=fetch('deck.enc',{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('bad');
    return r.json();
  });
  pre.then(function(j){ pack=j; }).catch(function(){});

  function b2a(b64){
    var raw=atob(b64), u=new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++) u[i]=raw.charCodeAt(i);
    return u;
  }

  f.addEventListener('submit', function(e){
    e.preventDefault();
    var v=pw.value;
    if(!v){ pw.focus(); return; }
    go.disabled=true; say('여는 중입니다', true);

    pre.then(function(j){
      pack=j;
      return crypto.subtle.importKey('raw', new TextEncoder().encode(v),
                                     {name:'PBKDF2'}, false, ['deriveKey']);
    }).then(function(base){
      return crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:b2a(pack.salt), iterations:pack.iter, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    }).then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM', iv:b2a(pack.iv)}, key, b2a(pack.ct));
    }).then(function(buf){
      var html=new TextDecoder().decode(buf);
      /* 통째로 갈아 끼운다. 주소는 그대로라 새로고침하면 다시 잠긴다 */
      document.open(); document.write(html); document.close();
    }).catch(function(err){
      go.disabled=false;
      if(!pack) say('소개서를 불러오지 못했습니다. 새로고침해 주세요');
      else { say('비밀번호가 맞지 않습니다'); pw.select(); }
    });
  });

  pw.addEventListener('input', function(){ if(m.textContent) say(''); });
  setTimeout(function(){ pw.focus(); }, 160);
})();

/* ═══ 유리가 빛을 꺾게 한다 ═════════════════════════════════════
   feDisplacementMap 은 이렇게 읽는다.
     어떤 자리를 그릴 때 지도의 같은 자리에서 R·G 를 보고
       sample = (x + scale*(R-0.5), y + scale*(G-0.5))
     회색(128,128)이면 안 휜다.
   진짜 유리는 가운데가 평평하고 **가장자리에서만** 꺾인다.
   그래서 지도도 가운데는 회색, 테두리 안쪽 좁은 띠에서만 바깥쪽으로 세진다. */
(function(){
  var ua = navigator.userAgent;
  /* 🔴 backdrop-filter 안의 SVG 필터는 크로미엄에서만 돈다.
     사파리·파이어폭스는 통째로 무시해서 흐림까지 날아갈 수 있으므로 아예 안 건다.
     iOS 의 크롬·파폭(CriOS·FxiOS)은 속이 사파리라 뺀다 */
  if(!/Chrom(e|ium)|Edg\/|OPR\//.test(ua) || /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua)) return;
  var cv = document.createElement('canvas');
  if(!cv.getContext || !cv.getContext('2d')) return;

  function sdf(x, y, w, h, r){           /* 둥근 네모까지의 거리. 안쪽이 음수 */
    var qx = Math.abs(x - w/2) - (w/2 - r), qy = Math.abs(y - h/2) - (h/2 - r);
    var ax = qx > 0 ? qx : 0, ay = qy > 0 ? qy : 0;
    return Math.sqrt(ax*ax + ay*ay) + Math.min(Math.max(qx, qy), 0) - r;
  }

  function draw(w, h, r, band, pow){
    w = Math.max(8, Math.round(w)); h = Math.max(8, Math.round(h));
    r = Math.min(r, Math.min(w, h)/2);
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var g = c.getContext('2d'), im = g.createImageData(w, h), d = im.data;
    for(var y = 0; y < h; y++) for(var x = 0; x < w; x++){
      var i = (y*w + x)*4, R = 128, G = 128;
      var sv = sdf(x+.5, y+.5, w, h, r);
      if(sv < 0){
        var t = -sv / band;
        if(t < 1){
          var wt = Math.pow(1 - t, pow);
          var gx = sdf(x+1.5, y+.5, w, h, r) - sdf(x-.5, y+.5, w, h, r);
          var gy = sdf(x+.5, y+1.5, w, h, r) - sdf(x+.5, y-.5, w, h, r);
          var n = Math.sqrt(gx*gx + gy*gy);
          if(n > 1e-6){ R = 128 + (gx/n)*wt*127; G = 128 + (gy/n)*wt*127; }
        }
      }
      d[i] = R; d[i+1] = G; d[i+2] = 128; d[i+3] = 255;
    }
    g.putImageData(im, 0, 0);
    return c.toDataURL('image/png');
  }

  var NS = 'http://www.w3.org/1999/xlink';
  function fit(el, mapId, dispId, radius, band, pow, scale){
    if(!el) return;
    var b = el.getBoundingClientRect();
    if(b.width < 8 || b.height < 8) return;
    var r = radius === 'pill' ? b.height/2 : radius;
    var url = draw(b.width, b.height, r, band, pow);
    var im = document.getElementById(mapId);
    im.setAttributeNS(NS, 'xlink:href', url);
    im.setAttribute('href', url);
    document.getElementById(dispId).setAttribute('scale', scale);
  }

  function build(){
    fit(document.querySelector('.card'), 'mCard', 'dCard', 28, 34, 1.7, 30);
    fit(document.getElementById('pw'),   'mField','dField','pill', 16, 1.7, 15);
    fit(document.getElementById('go'),   'mBtn',  'dBtn',  'pill', 16, 1.7, 17);
    document.documentElement.classList.add('lens');   /* 창 크기가 바뀔 때마다 또 붙지 않게 */
  }

  if(document.fonts && document.fonts.ready) document.fonts.ready.then(build);
  else build();
  var tm; addEventListener('resize', function(){
    clearTimeout(tm); tm = setTimeout(build, 180);
  });

  /* ② 포인터를 따라 움직이는 표면 반사 */
  var card = document.querySelector('.card'), lick = document.querySelector('.lick');
  if(card && lick && matchMedia('(hover:hover)').matches){
    card.addEventListener('pointermove', function(e){
      var b = card.getBoundingClientRect();
      lick.style.setProperty('--lx', ((e.clientX - b.left)/b.width*100).toFixed(1) + '%');
      lick.style.setProperty('--ly', ((e.clientY - b.top)/b.height*100).toFixed(1) + '%');
    });
  }
})();
</script>
</body>
</html>
